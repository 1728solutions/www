
<!--
VOICE GUIDELINES:

- This is a personal consulting practice (not a large firm)
- Prefer clarity over abstraction
- Avoid generic consulting language
- Ground ideas in real experience

- Tone: calm, precise, thoughtful
- Avoid: hype, buzzwords, exaggerated claims

- When possible, use "I" instead of "we"
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Contact — 1728 Solutions</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<div class="container">
			<a class="brand" href="/">1728 Solutions</a>
			<nav class="site-nav">
				<a href="/about.html">About</a>
				<a href="/services.html">Services</a>
				<a href="/work.html">Work</a>
			</nav>
		</div>
	</header>

	<main>
		<section class="container">
			<h1>Contact</h1>
			<p>We prefer a brief note describing context and desired outcomes rather than long RFP documents. Example: current challenge, key stakeholders, timeline, and what a successful outcome looks like.</p>

			<h2>Contact form</h2>
			<form action="/" method="get">
				<label for="name">Name</label>
				<input id="name" name="name" />

				<label for="email">Email</label>
				<input id="email" name="email" type="email" />

				<label for="message">Message</label>
				<textarea id="message" name="message" rows="6"></textarea>

				<p><button type="submit">Send</button></p>
			</form>
		</section>
	</main>

	<footer class="site-footer">
		<div class="container">
			<p><a href="/">Home</a></p>
		</div>
	</footer>
</body>
</html>
