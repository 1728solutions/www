<!--
Homepage for 1728 Solutions

Purpose:
A calm, precise consulting website that communicates systems thinking, integration across technical and organizational domains, and invites thoughtful engagement.

This is NOT a typical consulting site.
- No hype
- No aggressive sales language
- Emphasis on clarity, depth, integration, and patience

----------------------------------------
STRUCTURE
----------------------------------------

1. HERO

- Short, clear positioning statement
- Focus on:
  - systems integration
  - clarity in complexity
  - alignment across technical and organizational layers

- Supporting line:
  articulate the kinds of problems addressed

- Tone:
  grounded, thoughtful, intellectually honest

----------------------------------------

2. PROBLEM (What’s going wrong)

- Teams and organizations struggle with:
  - fragmentation across functions
  - disconnect between technical and organizational work
  - complexity that obscures clarity

- Keep it recognizable without being generically generic

----------------------------------------

3. SERVICES (Conceptual, not segmented)

- Present 3 high-level service categories

Examples:
- Systems Integration & Technical Leadership
- Organizational Effectiveness & Coaching
- Modeling & Architecture (e.g. digital twin work)

IMPORTANT:
- Do NOT divide into "Teams" vs "Individuals"
- Emphasize that work operates across levels

----------------------------------------

4. APPROACH (Atlas introduction)

- Introduce your way of thinking:
  - systems-oriented
  - integrative
  - connecting technical and human systems

- Brief and intriguing, not exhaustive

- Include a link to:
  /approach

----------------------------------------

5. PROOF (Credibility)

- Two paths:

A. Technical Work
- Link to /work
- Frame as real applied systems work

B. Impact
- Link to /impact
- Frame as outcomes and experiences

----------------------------------------

6. ENGAGEMENT PATHS

- Introduce two ways to proceed:

A. Services (understand the work)
B. Marketplace (concrete ways to engage)

- Link to:
  /services
  /marketplace

----------------------------------------

7. CTA (Call to Action)

- Invite conversation, not conversion

Examples:
- "Start a conversation"
- "Explore ways to work together"

- Link to:
  /contact

----------------------------------------

DESIGN PRINCIPLES

- Minimalist layout
- Large, readable typography
- Plenty of whitespace
- Grid-based layout for sections
- Subtle visual hierarchy (no heavy graphics)

/* Use:
- primary for headings and links
- secondary for buttons and key highlights
- accent for hover states
- neutrals for backgrounds and dividers

Avoid using too many colors in one section.
Keep the design minimal and calm.
*/


/*
Use CSS variables consistently:

- background → var(--color-bg)
- text → var(--color-text)
- headings/links → var(--color-primary)
- buttons/highlights → var(--color-secondary)
- hover accents → var(--color-accent)
- surfaces/cards → var(--color-surface)
- dividers → var(--color-muted)

Do not hardcode colors elsewhere.
*/

----------------------------------------

TONE

- Calm, precise, reflective
- Avoid:
  - buzzwords
  - startup language
  - exaggerated claims

- Favor:
  - clarity
  - restraint
  - intellectual confidence

----------------------------------------
-->
